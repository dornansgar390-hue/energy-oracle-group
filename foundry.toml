[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Включаем оптимизатор Solidity для минимизации стоимости газа на Arbitrum
optimizer = true
optimizer_runs = 200

# Указываем соответствие путей (remappings), чтобы импорты OpenZeppelin работали корректно
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Настройки сети для удобного деплоя через CLI
[rpc_endpoints]
arbitrum_sepolia = "https://arbitrum.io"
arbitrum_mainnet = "https://arb1.arbitrum.io/rpc"

# Настройка верификации контракта в Etherscan / Arbiscan
[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}" }
arbitrum_mainnet = { key = "${ARBISCAN_API_KEY}" }

