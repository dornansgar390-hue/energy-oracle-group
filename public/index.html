<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Energy Oracle — Under Reconstruction</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0f14;
            color: #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 520px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 0.3em;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.2em;
            letter-spacing: -0.5px;
        }
        .badge {
            display: inline-block;
            background: #5a1a1a;
            color: #f0888e;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5em;
        }
        p {
            color: #999;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5em;
        }
        .divider {
            width: 48px;
            height: 2px;
            background: #1f2a36;
            margin: 0 auto 1.5em;
            border-radius: 2px;
        }
        .footer {
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚧</div>
        <h1>Under reconstruction</h1>
        <div class="badge">Coming Soon — V2</div>
        <div class="divider"></div>
        <p>Energy Oracle is currently being rebuilt with expanded market coverage and new features. Check back soon.</p>
        <p class="footer">⚡ Powered by iExec Intel TDX · Arbitrum One</p>
    </div>
</body>
</html>
